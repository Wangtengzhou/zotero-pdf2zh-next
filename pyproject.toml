[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-pdf2zh-container"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["starlette>=0.49,<1", "httpx==0.28.1", "uvicorn>=0.34,<1"]

[project.scripts]
pdf2zh-admin = "gateway.admin:main"

[tool.setuptools]
packages = ["gateway"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
