name: Remove Legacy SHA Tags

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-tag-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Remove aliases and verify version tags
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'wangtengzhou/zotero-pdf2zh-next' }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python scripts/prune_sha_tags.py
