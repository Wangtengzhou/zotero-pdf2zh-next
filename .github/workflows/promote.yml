name: Promote Tested Digest to Latest

on:
  workflow_dispatch:
    inputs:
      digest:
        description: 'Verified image digest (sha256:...) after Zotero acceptance'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pdf2zh-promotion
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'wangtengzhou/zotero-pdf2zh-next' }}

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate digest
        env:
          IMAGE_DIGEST: ${{ inputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@783ae9cac559640a24c9212dfa6cd9e998252f9a
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote without rebuilding
        env:
          IMAGE_DIGEST: ${{ inputs.digest }}
        run: |
          docker buildx imagetools create --prefer-index=false --tag "$DOCKERHUB_IMAGE:latest" "$DOCKERHUB_IMAGE@$IMAGE_DIGEST"
          docker buildx imagetools inspect "$DOCKERHUB_IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
