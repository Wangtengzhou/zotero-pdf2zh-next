name: Publish Offline Image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag, for example v0.1.0'
        type: string
        required: true
      image_digest:
        description: 'Published Docker Hub image digest (sha256:...)'
        type: string
        required: true
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      image_digest:
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: offline-image-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'wangtengzhou/zotero-pdf2zh-next' }}
  RELEASE_TAG: ${{ inputs.release_tag }}
  IMAGE_DIGEST: ${{ inputs.image_digest }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate references
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false
      - name: Pull and verify published image
        run: |
          docker pull --platform linux/amd64 "$IMAGE@$IMAGE_DIGEST"
          docker tag "$IMAGE@$IMAGE_DIGEST" "$IMAGE:$VERSION"
          image_version=$(docker image inspect "$IMAGE:$VERSION" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          image_revision=$(docker image inspect "$IMAGE:$VERSION" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          [[ "$image_version" == "$VERSION" ]]
          [[ "$image_revision" == "$(git rev-parse HEAD)" ]]
          [[ "$(docker image inspect "$IMAGE:$VERSION" --format '{{.Os}}/{{.Architecture}}')" == linux/amd64 ]]
      - name: Export and verify Docker archive
        run: |
          mkdir -p release-assets
          archive="release-assets/zotero-pdf2zh-next-$VERSION-linux-amd64.tar.gz"
          image_id=$(docker image inspect "$IMAGE:$VERSION" --format '{{.Id}}')
          docker save "$IMAGE:$VERSION" | gzip -6 > "$archive"
          gzip -t "$archive"
          docker load --input "$archive"
          [[ "$(docker image inspect "$IMAGE:$VERSION" --format '{{.Id}}')" == "$image_id" ]]
          [[ "$(stat -c %s "$archive")" -lt 2147483648 ]]
          cp compose.yaml release-assets/compose.yaml
          cp .env.example release-assets/env.example
          {
            echo "镜像 / Image: $IMAGE:$VERSION"
            echo "仓库摘要 / Registry digest: $IMAGE_DIGEST"
            echo "镜像 ID / Image ID: $image_id"
            echo "源码提交 / Source revision: $(git rev-parse HEAD)"
            echo "归档字节数 / Archive bytes: $(stat -c %s "$archive")"
            echo
            echo '镜像层大小（未压缩） / Layer sizes (uncompressed):'
            docker history --no-trunc --format '{{.Size}}  {{.CreatedBy}}' "$IMAGE:$VERSION"
            echo
            echo '容器目录大小 / Directory sizes in the final container:'
            docker run --rm --entrypoint sh "$IMAGE:$VERSION" -c \
              'du -sh /usr/local/lib/python3.12/site-packages /home/app/.cache /usr/lib /app; echo; du -sh /usr/local/lib/python3.12/site-packages/* /home/app/.cache/* | sort -hr | head -n 20'
          } > release-assets/IMAGE_INFO.txt
          (cd release-assets && sha256sum ./*.tar.gz compose.yaml env.example IMAGE_INFO.txt > SHA256SUMS)
          cat release-assets/IMAGE_INFO.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > release-notes.md
          for changelog in CHANGELOG.md CHANGELOG.en.md; do
            [[ -f "$changelog" ]] || continue
            awk -v version="$VERSION" '
              index($0, "## " version " - ") == 1 {inside=1; next}
              /^## / && inside {exit}
              inside {print}
            ' "$changelog" > release-section.md
            [[ -s release-section.md ]]
            if [[ "$changelog" == CHANGELOG.en.md ]]; then
              echo '## English' >> release-notes.md
            elif [[ -f CHANGELOG.en.md ]]; then
              echo '## 中文' >> release-notes.md
            fi
            cat release-section.md >> release-notes.md
          done
          [[ -s release-notes.md ]]
          cat >> release-notes.md <<'NOTES'

          ## 离线镜像 / Offline Docker Image

          下载下方的 `linux-amd64.tar.gz` 镜像附件，然后使用以下命令导入。将 VERSION 替换为本次版本号。
          NAS 图形化导入窗口若不支持 gzip，先解压为 `.tar`，无需解开 tar 内部文件。

          Download the `linux-amd64.tar.gz` asset below, then import it with:

          ```bash
          docker load --input zotero-pdf2zh-next-VERSION-linux-amd64.tar.gz
          ```

          Replace VERSION with this release's version. NAS users can decompress it to `.tar` if their image import dialog does not accept gzip.

          附件中的 `compose.yaml` 和 `env.example` 用于部署；将 `env.example` 重命名为 `.env`，不需要配置域名环境变量。局域网直连时，将 `BIND_ADDRESS` 设为服务器内网 IP 或 `0.0.0.0`。
          在容器终端运行 `pdf2zh-admin url show` 获取令牌路径，可接在内网地址或任意 HTTPS 反代域名后。
          导入后使用 `docker compose up -d --pull never` 启动，无需从 Docker Hub 下载。
          使用 `SHA256SUMS` 校验下载文件；`IMAGE_INFO.txt` 记录镜像摘要和大小组成。
          GitHub 自动生成的 “Source code” 下载包是源码，不是 Docker 镜像。

          `compose.yaml` and `env.example` are included for deployment. Rename `env.example` to `.env`; no domain environment variable is required. For LAN access, set `BIND_ADDRESS` to your server LAN IP or `0.0.0.0`.
          Run `pdf2zh-admin url show` inside the container to get the token path, and append it to your LAN address or any HTTPS reverse proxy domain.
          Use `docker compose up -d --pull never` after importing; no Docker Hub download is needed.
          Verify downloads against `SHA256SUMS`. `IMAGE_INFO.txt` records the source image digest and its size breakdown.
          GitHub's automatically generated "Source code" downloads contain source files, not a Docker image.
          NOTES
          sed -i "s/zotero-pdf2zh-next-VERSION-/zotero-pdf2zh-next-$VERSION-/g" release-notes.md
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/*
          gh release edit "$RELEASE_TAG" --draft=false --notes-file release-notes.md
